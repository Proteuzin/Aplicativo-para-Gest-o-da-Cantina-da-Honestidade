<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Cantina</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/scrpit.js" defer></script>
</head>

<body>
    <div class="principal">
        <div class="box_login">
            <div class="box">
                <img src="../img/logo.png" width="200px" alt="logo">
                <h1>Cadastro</h1>
                <div class="user">
                    <label for="user">Usuário</label>
                    <input type="text" id="user" placeholder="Insira matrícula, e-mail ou CPF">
                </div>
                <div class="password">
                    <label for="password">Senha</label>
                    <div class="senha-container">
                        <input type="password" id="password" placeholder="Insira sua senha">
                        <button type="button" class="button_password" onclick="mostrarSenha('password', this)"><img
                                class="olho" src="../img/olho.png" width="20px" alt="Mostrar senha">
                        </button>
                    </div>
                </div>
                <div class="password2">
                    <div class="senhacontainer2">
                        <input type="password" id="password2" placeholder="Insira sua senha novamente">
                        <button type="button" class="button_password" onclick="mostrarSenha('password2', this)">
                            <img src="../img/olho.png" width="20px" alt="Mostrar senha">
                        </button>
                    </div>
                </div>
                <button id="button_cadastro">Confirmar</button>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
